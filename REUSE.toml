version = 1

# Copyright for every file; each file carries its own SPDX-License-Identifier.
[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 noon-at-cgn"

# Files that cannot carry a comment, or that are kept exactly as GitHub writes them.
[[annotations]]
path = ["LICENSE", ".github/FUNDING.yml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 noon-at-cgn"
SPDX-License-Identifier = "MIT"
